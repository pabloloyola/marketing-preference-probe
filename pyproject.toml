[project]
name = "marketing-preference-probe"
version = "0.1.0"
description = "Compare generative and decision-model predictions against human A/B results"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
marketing-probe = "marketing_probe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketing_probe"]
